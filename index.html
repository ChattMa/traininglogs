<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Log & Leaderboard</title>
    <style>
        body { background-color: #050505; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background-color: #111111; border: 1px solid #1f1f1f; border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); margin-bottom: 20px; box-sizing: border-box; }
        h2 { color: #dcb345; text-align: center; letter-spacing: 2px; margin-bottom: 30px; font-size: 24px; text-transform: uppercase; margin-top: 0; }
        select { width: 100%; padding: 15px; background-color: #1a1a1a; color: #ffffff; border: 1px solid #333; border-radius: 8px; font-size: 16px; margin-bottom: 25px; appearance: none; outline: none; cursor: pointer; }
        .buttons-container { display: flex; gap: 15px; }
        button { flex: 1; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        #startBtn { background-color: #dcb345; color: #000000; }
        #endBtn { background-color: #2a2a2a; color: #ffffff; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
        .status { margin-top: 20px; text-align: center; font-size: 14px; color: #888; min-height: 20px; }
        .sync-status { font-size: 11px; color: #555; text-align: center; margin-bottom: 10px; }
        .leaderboard { width: 100%; list-style: none; padding: 0; margin: 0; }
        .leaderboard li { display: flex; justify-content: space-between; padding: 12px 15px; background-color: #1a1a1a; margin-bottom: 8px; border-radius: 8px; border: 1px solid #222; }
        .leaderboard li span:last-child { color: #dcb345; font-weight: bold; }
    </style>
</head>
<body>

    <div class="sync-status" id="syncStatus">Подключение к базе...</div>

    <div class="card">
        <h2>TRAINING LOG</h2>
        <select id="playerSelect">
            <option value="" disabled selected>КТО ТРЕНИРУЕТСЯ?</option>
            <option value="zhalou(Катя)">zhalou(Катя)</option>
            <option value="ChattMa(Саша)">ChattMa(Саша)</option>
            <option value="Blessed(Егор)">Blessed(Егор)</option>
            <option value="Gerader(Коля)">Gerader(Коля)</option>
            <option value="pariiicide(Костя)">pariiicide(Костя)</option>
            <option value="katsuryoku(Виталя)">katsuryoku(Виталя)</option>
            <option value="ka1zo (Егор)">ka1zo (Егор)</option>
        </select>

        <div class="buttons-container">
            <button id="startBtn" disabled>START</button>
            <button id="endBtn" disabled>END</button>
        </div>

        <div class="status" id="statusMessage">Загрузка данных...</div>
    </div>

    <div class="card">
        <h2>ЛИДЕРБОРД</h2>
        <ul class="leaderboard" id="leaderboardList"></ul>
    </div>

    <script>
        // ПИН-КОДЫ (при желании можно изменить цифры на другие)
        const PIN_CODES = {
            "zhalou(Катя)": "9268",
            "ChattMa(Саша)": "8426",
            "Blessed(Егор)": "1591",
            "Gerader(Коля)": "9675",
            "pariiicide(Костя)": "2378",
            "katsuryoku(Виталя)": "8926",
            "ka1zo (Егор)": "2724"
        };

        // НАСТРОЙКИ БАЗЫ ДАННЫХ
        const BIN_ID = "6a1618d9f47d5c455c3ad442"; 
        const API_KEY = "$2a$10$93.jNawD.2c1x82k9W3naOY3.v8QkO2QLWtXl2X/LqgC9MdvinlX."; 
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        const defaultPlayers = {
            "zhalou(Катя)": 0, "ChattMa(Саша)": 0, "Blessed(Егор)": 0,
            "Gerader(Коля)": 0, "pariiicide(Костя)": 0, "katsuryoku(Виталя)": 0, "ka1zo (Егор)": 0
        };

        let localState = null;
        let isSaving = false;

        const playerSelect = document.getElementById('playerSelect');
        const startBtn = document.getElementById('startBtn');
        const endBtn = document.getElementById('endBtn');
        const statusMessage = document.getElementById('statusMessage');
        const leaderboardList = document.getElementById('leaderboardList');
        const syncStatus = document.getElementById('syncStatus');

        function formatTime(ms) {
            let totalSeconds = Math.floor(ms / 1000);
            let hours = Math.floor(totalSeconds / 3600);
            let minutes = Math.floor((totalSeconds % 3600) / 60);
            let seconds = totalSeconds % 60;
            return `${hours}ч ${minutes}м ${seconds}с`;
        }

        async function fetchState() {
            if (isSaving) return;
            try {
                const response = await fetch(API_URL, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.message || `Ошибка сервера ${response.status}`);
                }

                const data = await response.json();
                
                if (data.record && data.record.players) {
                    localState = data.record;
                } else {
                    localState = { players: defaultPlayers, currentSession: null };
                }

                updateUI();
                syncStatus.textContent = "Синхронизировано ✅";
                syncStatus.style.color = "#555";
            } catch (e) {
                console.error("Ошибка:", e);
                syncStatus.textContent = "Ошибка: " + e.message;
                syncStatus.style.color = "red";
                statusMessage.innerHTML = "<b>❌ Ошибка базы данных. Проверь настройки в JSONBin.</b>";
                
                localState = { players: defaultPlayers, currentSession: null };
                updateUI();
            }
        }

        async function saveState() {
            isSaving = true;
            syncStatus.textContent = "Сохранение...";
            syncStatus.style.color = "#555";
            try {
                const response = await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(localState)
                });
                
                if (!response.ok) throw new Error("Ошибка при сохранении");
                
                syncStatus.textContent = "Синхронизировано ✅";
            } catch (e) {
                console.error("Ошибка сохранения:", e);
                syncStatus.textContent = "Ошибка при сохранении!";
                syncStatus.style.color = "red";
            } finally {
                isSaving = false;
            }
        }

        function updateUI() {
            if (!localState) return;

            if (localState.currentSession) {
                playerSelect.value = localState.currentSession.player;
                playerSelect.disabled = true;
                startBtn.disabled = true;
                endBtn.disabled = false;
                statusMessage.innerHTML = `🔥 Сейчас тренируется: <b>${localState.currentSession.player}</b>`;
            } else {
                playerSelect.disabled = false;
                startBtn.disabled = false;
                endBtn.disabled = true;
                statusMessage.textContent = "Все отдыхают. Готов к старту.";
            }

            leaderboardList.innerHTML = '';
            const sortedPlayers = Object.entries(localState.players).sort((a, b) => b[1] - a[1]);

            sortedPlayers.forEach(([player, time]) => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${player}</span><span>${formatTime(time)}</span>`;
                leaderboardList.appendChild(li);
            });
        }

        startBtn.addEventListener('click', async () => {
            const selectedPlayer = playerSelect.value;
            if (!selectedPlayer) return;

            const enteredPin = prompt(`Введите ПИН-код для: ${selectedPlayer}`);
            if (enteredPin !== PIN_CODES[selectedPlayer]) {
                alert("❌ Неверный ПИН-код!");
                return;
            }

            startBtn.disabled = true;
            await fetchState(); 

            localState.currentSession = {
                player: selectedPlayer,
                startTime: Date.now()
            };

            await saveState();
            updateUI();
        });

        endBtn.addEventListener('click', async () => {
            if (!localState.currentSession) return;
            
            const currentPlayer = localState.currentSession.player;
            const enteredPin = prompt(`Введите ПИН-код для завершения (${currentPlayer}):`);
            
            if (enteredPin !== PIN_CODES[currentPlayer]) {
                alert("❌ Неверный ПИН-код!");
                return;
            }

            endBtn.disabled = true;
            const duration = Date.now() - localState.currentSession.startTime;
            
            localState.players[currentPlayer] += duration;
            localState.currentSession = null;

            await saveState();
            playerSelect.value = "";
            updateUI();
        });

        fetchState();
        setInterval(fetchState, 5000);
    </script>
</body>
</html>
